<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Essendon Carpet & Upholstery Cleaning</title>
  <meta name="description" content="Contact form for free quote and enquiries." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--clr-primary:#0066cc;--clr-accent:#ff6600;--clr-bg:#fff;--clr-text:#111;--clr-muted:#555}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Inter",sans-serif;background:var(--clr-bg);color:var(--clr-text);line-height:1.6}
    a{color:var(--clr-primary);text-decoration:none}
    .site-header{background:var(--clr-primary);color:#fff;padding:1rem;display:flex;justify-content:space-between;align-items:center}
    .site-header a{color:#fff;margin-right:1rem}
    .hero{background:url("https://via.placeholder.com/1600x600?text=Contact+Us") center/cover no-repeat;height:40vh;display:flex;align-items:center;justify-content:center;color:#fff}
    .container{max-width:960px;margin:2rem auto;padding:0 1rem}
    form label{display:block;margin-bottom:0.6rem}
    input,select,textarea{width:100%;padding:0.6rem;border:1px solid #ddd;border-radius:4px;margin-top:0.2rem}
    button{background:var(--clr-primary);color:#fff;border:none;padding:0.8rem 1.5rem;border-radius:4px;cursor:pointer;font-weight:600;transition:background .3s}
    button:hover{background:#0055a0}
    footer{background:#222;color:#ccc;text-align:center;padding:1rem;font-size:.9rem;margin-top:3rem}
  </style>
</head>
<body>
<header class="site-header">
  <h1>Essendon Carpet & Upholstery Cleaning</h1>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/services.html">Services</a>
    <a href="/contact.html">Contact</a>
  </nav>
</header>
<section class="hero" role="img" aria-label="Contact us">
  <div><h1>Get a Free Quote</h1></div>
</section>
<div class="container" id="contact">
  <p>Call us at <strong>+61 3 1234 5678</strong> or fill the form below.</p>
  <form action="#" method="post">
    <label>Name:<input type="text" name="name" required /></label>
    <label>Email:<input type="email" name="email" required /></label>
    <label>Phone:<input type="tel" name="phone" required /></label>
    <label>Service needed:
      <select name="service">
        <option>Carpet cleaning</option>
        <option>Upholstery cleaning</option>
        <option>Rug cleaning</option>
        <option>Bond cleaning</option>
      </select>
    </label>
    <label>Message:<textarea name="message" rows="4"></textarea></label>
    <button type="submit">Submit</button>
  </form>
</div>
<footer>© 2026 Essendon Carpet & Upholstery Cleaning – Melbourne, VIC – All rights reserved.</footer>
</body>
</html>
